[package]
name = "nezzel"
version = "0.1.0-beta.1"
description = "Save videos, audio and photos from links."
license = "AGPL-3.0-or-later"
authors = ["Jelle Glebbeek", "Ahmed Abdat"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant, but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nezzel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = ["isolation"] }

[dependencies]
tauri = { version = "2.12.5", features = ["isolation", "image-png", "tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2.7.2"
tauri-plugin-global-shortcut = "2.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri-plugin-shell = "2.6.0"
uuid = { version = "1.29.0", features = ["v4"] }
futures = "0.3.34"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-store = "2.5.0"
tauri-plugin-notification = "2.8.0"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-updater = "2.14.1"
arc-swap = "1.9.3"
tokio = { version = "1.54.1", features = ["full"] }
reqwest = { version = "0.13.5", features = ["json", "socks", "stream"] }
sha2 = "0.11.1"
httpdate = "1.0.3"
hmac = "0.13.0"
dirs = "7.0.0"
icu_properties = "2.4.0"
ed25519-dalek = "3.0.0"
base64 = "0.23.1"
hex = "0.4.3"
zip = "9.2.2"
tar = "0.4.46"
bzip2 = "0.6.1"
lzma-rust2 = { version = "0.23.0", default-features = false, features = ["std", "xz"] }
tauri-plugin-keyring = "0.1.0"
rand = "0.10.3"
tauri-plugin-stronghold = "2.4.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
sentry = "0.48.2"
regex = "1.13.1"
fs_extra = "1.3.0"
indexmap = { version = "2.14.2", features = ["serde"] }
include_dir = "0.7.4"
sys-locale = "0.3.2"
notify-rust = "4.18.2"
shlex = "2.0.1"
trash = "5.2.9"
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }
psl = "2.1.246"

[dev-dependencies]
lzma-rust2 = { version = "0.23.0", default-features = false, features = ["encoder"] }
tokio = { version = "1.54.1", features = ["test-util"] }
http = "1.5.0"
tauri = { version = "2.12.5", features = ["test"] }

# Opt-in developer harness; excluded from the app and normal test suite.
[[example]]
name = "link_matrix"
required-features = ["link-matrix"]

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

# Linux clipboard: GTK's own clipboard (what the webview pastes from) and a data-control probe. Both are
# already in the tree through tauri/arboard.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
wl-clipboard-rs = "0.9"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Ioctl", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[profile.dev]
incremental = true

[profile.dev.package.scrypt]
opt-level = 3

[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true
opt-level = "s"
panic = "abort"
strip = false
debug = 1
split-debuginfo = "packed"

[features]
file-engine-bench = []
link-matrix = []

[[example]]
name = "file-engine-bench"
path = "examples/file-engine-bench.rs"
required-features = ["file-engine-bench"]
