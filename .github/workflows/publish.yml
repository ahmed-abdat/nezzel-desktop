name: 'Publish'

on:
  workflow_dispatch:
  push:
    branches:
      - release

jobs:
  publish-tauri:
    permissions:
      contents: write
    env:
      WINDOWS_PFX_B64: ${{ secrets.WINDOWS_PFX_B64 }}
      WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
      # Unset secrets mean "off": unsigned macOS beta (ad-hoc), no Sentry, no MSIX.
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_SENTRY: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            galleryTarget: 'aarch64-apple-darwin'
          - platform: 'macos-15-intel'
            args: '--target x86_64-apple-darwin'
            galleryTarget: 'x86_64-apple-darwin'
          # .deb/.rpm link the build's glibc: build on 22.04 for the 2.35 floor.
          - platform: 'ubuntu-22.04'
            args: '--bundles deb,rpm'
            galleryTarget: 'x86_64-unknown-linux-gnu'
          - platform: 'ubuntu-22.04-arm'
            args: '--bundles deb,rpm'
            galleryTarget: 'aarch64-unknown-linux-gnu'
          # The AppImage is its own leg on 24.04: an aarch64 sharun AppImage built on 22.04
          # aborts at start ("GLib-ERROR getauxval() failed",
          # https://github.com/pkgforge-dev/Anylinux-AppImages/issues/1001). sharun bundles its
          # own glibc, so the AppImage still runs on 22.04-era distros.
          - platform: 'ubuntu-24.04'
            args: '--bundles appimage'
            galleryTarget: 'x86_64-unknown-linux-gnu'
          - platform: 'ubuntu-24.04-arm'
            args: '--bundles appimage'
            galleryTarget: 'aarch64-unknown-linux-gnu'
          - platform: 'windows-latest'
            args: ''
            galleryTarget: 'x86_64-pc-windows-msvc'
          - platform: 'windows-11-arm'
            args: ''
            galleryTarget: 'aarch64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The x86_64 AppImage leg ran out of disk while bundling (run 42705804135, os error 28):
      # drop the preinstalled SDKs the build never uses (about 20 GB).
      - name: free disk space (ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - name: install dependencies (ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: install Rust 1.99.1
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.platform == 'windows-11-arm' && 'aarch64-pc-windows-msvc' || '' }}

      - name: Install cargo-about
        uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-about

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: './src-tauri -> target'
          # One cache per runner image: C objects built against another glibc fail to link.
          prefix-key: v2-${{ matrix.platform }}

      # install-action has no x86_64-macOS cargo-about build; its binstall fallback can leave a
      # binary `cargo about` can't run. Check the real subcommand after the cache restore.
      - name: Ensure cargo-about works
        shell: bash
        run: cargo about --version || cargo install cargo-about --locked --force --features cli && cargo about --version

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up pinned Python for gallery-dl preparation
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14.6'

      - name: Prepare hash-verified gallery-dl and installer tools
        run: python scripts/fetch-gallery-dl.py --target ${{ matrix.galleryTarget }} && python scripts/fetch-tools.py --target ${{ matrix.galleryTarget }}

      - name: Ad-hoc sign without an Apple certificate (macOS only)
        if: startsWith(matrix.platform, 'macos') && env.HAS_APPLE_CERT != 'true'
        run: echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"

      - name: Import Apple Developer Certificate (MacOS only)
        if: startsWith(matrix.platform, 'macos') && env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain
          # The exact identity, for Tauri and for fetch-tools.py --sign-macos (nested yt-dlp and
          # gallery-dl onedirs, then gallery-dl.sha256 of the signed bytes). Unset, both sign ad-hoc.
          identity=$(security find-identity -v -p codesigning build.keychain | sed -n 's/.*"\(Developer ID Application: .*\)"$/\1/p' | head -1)
          if [ -z "$identity" ]; then
            echo "::error::no Developer ID Application identity in the imported certificate"
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Prepare notarization key (macOS only)
        if: startsWith(matrix.platform, 'macos') && env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          mkdir -p "$(dirname "$APPLE_API_KEY_PATH")"
          printf '%s' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH"
          # Notarization env reaches the build only when signing is on (empty values would still trigger it).
          {
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            echo "APPLE_API_KEY=$APPLE_API_KEY"
            echo "APPLE_API_KEY_PATH=$APPLE_API_KEY_PATH"
          } >> "$GITHUB_ENV"

      - name: Setup Sentry CLI
        if: matrix.platform != 'windows-11-arm' && env.HAS_SENTRY == 'true'
        uses: matbour/setup-sentry-cli@ac9d752ca8f44ef545fb2ce2dcd329cce57d778b # v2
        with:
          version: 2.58.2
          token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          organization: ${{ secrets.SENTRY_ORG }}
          project: ${{ secrets.SENTRY_PROJECT }}

      # TEMPORARY WORKAROUND:
      # Use a custom tauri-cli branch to enable the new "truly portable" AppImage format.
      # This relies on TAURI_BUNDLER_NEW_APPIMAGE_FORMAT=true and can be removed once
      # https://github.com/tauri-apps/tauri/pull/12491 is merged and released upstream.
      #
      # Pin to the last revision before the quick-sharun migration, which started
      # delegating bundling to a mutable external script downloaded at build time.
      - name: Override tauri-cli (ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu')
        shell: bash
        run: |
          cargo install tauri-cli --git https://github.com/tauri-apps/tauri --rev b5573c1db2bb6118594b586a6aa51aeb37aa7d84 --locked --force
          echo "TAURI_BUNDLER_NEW_APPIMAGE_FORMAT=true" >> "$GITHUB_ENV"

      # TEMPORARY WORKAROUND:
      # Because we use "cargo tauri" in that tauri build step, we always have to install tauri cli here.
      - name: Install tauri-cli
        if: ${{ !startsWith(matrix.platform, 'ubuntu') }}
        shell: bash
        run: |
          cargo install tauri-cli

      - name: Bound the dmg Finder script (macOS only)
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: nohup bash scripts/dmg-osascript-watchdog.sh 300 > "$RUNNER_TEMP/dmg-watchdog.log" 2>&1 &

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Our own Sentry project (owner-set secret); unset means the build sends nothing.
          NEZZEL_SENTRY_DSN: ${{ secrets.NEZZEL_SENTRY_DSN }}
          # Daily anonymous usage counts to our own Worker (docs/specs/usage-counts.md); unset means off.
          NEZZEL_USAGE_URL: ${{ secrets.NEZZEL_USAGE_URL }}
          # TEMPORARY WORKAROUND:
          # This environment variable is needed to enable the new appimage features.
          TAURI_BUNDLER_NEW_APPIMAGE_FORMAT: "true"
          # Tauri skips the Finder AppleScript on CI (CI=true), which drops the dmg window
          # layout: background art and icon spots (tauri#1731). GitHub macOS runners have a
          # GUI session, so run it there; the watchdog step above bounds it to 5 min (on
          # timeout the dmg ships plain). Checked by the "Dmg window layout" step below.
          TAURI_BUNDLER_DMG_IGNORE_CI: ${{ startsWith(matrix.platform, 'macos') && 'true' || 'false' }}
        with:
          tagName: app-v__VERSION__
          releaseName: 'Nezzel v__VERSION__'
          releaseBody: |
            See the assets to download this version and install. If you have an existing install, it will auto-update on launch.

            Third-party source: Nezzel-__VERSION__-SOURCES.tar.gz contains bundled tool sources, build information and licences. SHA256SUMS covers the release assets. See the source archive README for provider source limitations.
          releaseDraft: true
          prerelease: false
          # One job writes latest.json after all legs (updater-json below): per-leg merges race.
          uploadUpdaterJson: false
          updaterJsonPreferNsis: true
          # TEMPORARY WORKAROUND:
          # This option is needed to use the possibly overriden branch of tauri-cli, to fix appimages.
          tauriScript: 'cargo tauri'
          args: ${{ matrix.args }}

      - name: Dmg window layout (macOS only)
        if: startsWith(matrix.platform, 'macos')
        continue-on-error: true
        shell: bash
        run: |
          set +e
          cat "$RUNNER_TEMP/dmg-watchdog.log" 2>/dev/null
          shopt -s nullglob
          dmgs=(src-tauri/target/*/release/bundle/dmg/*.dmg src-tauri/target/release/bundle/dmg/*.dmg)
          if [ ${#dmgs[@]} -eq 0 ]; then
            echo "::warning::no dmg found to check the Finder layout"
            exit 0
          fi
          mnt=$(mktemp -d)
          if ! hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "${dmgs[0]}" >/dev/null; then
            echo "::warning::could not mount ${dmgs[0]} to check the Finder layout"
            exit 0
          fi
          if [ -f "$mnt/.DS_Store" ] && [ -f "$mnt/.background/background.tiff" ]; then
            echo "dmg layout applied"
          else
            echo "::warning::dmg has no Finder layout (.DS_Store/background missing): the first-open steps won't show"
          fi
          hdiutil detach "$mnt" >/dev/null || hdiutil detach -force "$mnt" >/dev/null || true

      - name: Bundled tools start from the built app (macOS only)
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          shopt -s nullglob
          # This leg's --target bundle only (the host target dir can hold another build).
          apps=("src-tauri/target/${{ matrix.galleryTarget }}/release/bundle/macos/Nezzel.app")
          if (( ${#apps[@]} != 1 )); then
            echo "FAIL expected one Nezzel.app, found ${#apps[@]}"
            exit 1
          fi
          bash scripts/macos-app-smoke.sh "${apps[0]}"

      - name: Create public PDBs (Windows only)
        if: matrix.platform == 'windows-latest' || matrix.platform == 'windows-11-arm'
        shell: pwsh
        run: |
          $kitsRoot = "${Env:ProgramFiles(x86)}\Windows Kits\10"
          if (-not (Test-Path $kitsRoot)) {
            Write-Error "Windows 10 Kits folder not found at $kitsRoot"
          }

          $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'arm64' } else { 'x64' }
          $pdbcopy = Get-ChildItem -Path $kitsRoot -Recurse -Filter "pdbcopy.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "\\$arch\\pdbcopy\.exe$" } |
            Select-Object -First 1

          if (-not $pdbcopy -and $env:RUNNER_ARCH -eq 'ARM64') {
            $pdbcopy = Get-ChildItem -Path $kitsRoot -Recurse -Filter "pdbcopy.exe" -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match "\\x64\\pdbcopy\.exe$" } |
              Select-Object -First 1
          }

          if (-not $pdbcopy) {
            Write-Error "pdbcopy.exe not found under $kitsRoot"
          }

          $pdbs = Get-ChildItem -Path "src-tauri/target/release" -Filter "*.pdb"
          if (-not $pdbs) {
            Write-Error "No PDB files found under src-tauri/target/release"
          }

          $publicDir = "src-tauri/target/release/public-pdb"
          New-Item -ItemType Directory -Path $publicDir -Force | Out-Null

          foreach ($pdb in $pdbs) {
            $outPath = Join-Path $publicDir $pdb.Name
            & "$($pdbcopy.FullName)" "$($pdb.FullName)" "$outPath" -p
          }

      - name: Upload debug symbols to Sentry
        if: matrix.platform != 'windows-11-arm' && env.HAS_SENTRY == 'true'
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          SENTRY_RELEASE="nezzel@${VERSION}"
          export SENTRY_RELEASE
          
          echo "Using Sentry release: $SENTRY_RELEASE"
          
          cd src-tauri
          
          if [ -d "target/release/public-pdb" ]; then
            sentry-cli debug-files upload --include-sources target/release/public-pdb
          else
            sentry-cli debug-files upload --include-sources target/release
          fi
          
          if [ "${{ matrix.platform }}" = "ubuntu-22.04" ]; then
            sentry-cli releases new "$SENTRY_RELEASE" || true
            sentry-cli releases set-commits "$SENTRY_RELEASE" --auto || true
            sentry-cli releases finalize "$SENTRY_RELEASE" || true
          fi

      - name: Stage pinned installer payload for MSIX (Windows only)
        if: matrix.platform == 'windows-latest' || matrix.platform == 'windows-11-arm'
        shell: pwsh
        run: |
          $appFolder = "msix-layout/Nezzel"
          New-Item -ItemType Directory -Path "$appFolder/bin" -Force | Out-Null
          foreach ($sidecar in @("aria2c.exe", "gallery-dl.exe", "ffmpeg.exe", "ffprobe.exe", "deno.exe", "gallery-dl.sha256")) {
            Copy-Item (Join-Path "src-tauri/target/release" $sidecar) -Destination $appFolder -Force
          }
          Copy-Item "src-tauri/target/release/tools" -Destination $appFolder -Recurse -Force
          # Store binaries are immutable. Use the same bundled paths as NSIS/portable.
          $metadata = @{ is_locked = $true; versions = @{} }
          $metadata | ConvertTo-Json | Set-Content "$appFolder/bin/metadata.json"

      - name: Bundle Portable Version (Windows only)
        if: matrix.platform == 'windows-latest' || matrix.platform == 'windows-11-arm'
        shell: pwsh
        run: |
          $releaseDir = "src-tauri/target/release"
          $layoutRoot = "portable-layout"
          $portableFolder = "ovd-portable"

          $pkg = Get-Content -Raw "package.json" | ConvertFrom-Json
          $version = $pkg.version
          
          # Detect architecture
          $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'arm64' } else { 'x64' }
          
          $zipName = "Nezzel_$($version)_$($arch)-portable.zip"
          $exeName = "Nezzel_$($version)_$($arch).exe"
          $keepFileName = ".keep"
          
          $tagName = "app-v$version"
          Write-Host "Building portable bundle for $arch architecture: $zipName"
          Write-Host "Using release tag: $tagName"
          
          # The app binary, not a bundled sidecar (aria2c/gallery-dl .exe also sit in this folder).
          $exe = Get-Item -Path (Join-Path $releaseDir "nezzel.exe") -ErrorAction SilentlyContinue
          if (-not $exe) { Write-Error "Could not find main exe in $releaseDir" }
          
          New-Item -ItemType Directory -Path "$layoutRoot/$portableFolder" -Force | Out-Null
          New-Item -ItemType File -Path "$layoutRoot/$portableFolder/$keepFileName" -Value "Do not remove this file or directory." -Force | Out-Null
          Copy-Item $exe.FullName -Destination "$layoutRoot/$exeName" -Force
          foreach ($sidecar in @("aria2c.exe", "gallery-dl.exe", "ffmpeg.exe", "ffprobe.exe", "deno.exe", "gallery-dl.sha256")) {
            Copy-Item (Join-Path $releaseDir $sidecar) -Destination $layoutRoot -Force
          }
          Copy-Item (Join-Path $releaseDir "tools") -Destination $layoutRoot -Recurse -Force
          Copy-Item (Join-Path $releaseDir "licenses") -Destination $layoutRoot -Recurse -Force
          
          Compress-Archive -Path "$layoutRoot/*" -DestinationPath $zipName -Force
      
          echo "PORTABLE_ASSET=$zipName" >> $env:GITHUB_ENV
          echo "RELEASE_TAG=$tagName" >> $env:GITHUB_ENV

      - name: Upload Portable (Windows only)
        if: matrix.platform == 'windows-latest' || matrix.platform == 'windows-11-arm'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Uploading ${PORTABLE_ASSET} to release ${RELEASE_TAG}"
          gh release upload "${RELEASE_TAG}" "${PORTABLE_ASSET}" --clobber

      - name: Install VC++ runtime (Windows ARM64 only)
        if: matrix.platform == 'windows-11-arm'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "vc_redist.arm64.exe"
          Invoke-WebRequest -Uri "https://aka.ms/vc14/vc_redist.arm64.exe" -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "/install","/quiet","/norestart" -Wait

      - name: Build and sign MSIX (Windows only)
        if: (matrix.platform == 'windows-latest' || matrix.platform == 'windows-11-arm') && env.WINDOWS_PFX_B64 != ''
        uses: ./.github/actions/msix-build-sign
        with:
          pfx-b64: ${{ secrets.WINDOWS_PFX_B64 }}
          pfx-password: ${{ secrets.WINDOWS_PFX_PASSWORD }}
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}

      - name: Upload MSIX artifact (Windows only)
        if: (matrix.platform == 'windows-latest' || matrix.platform == 'windows-11-arm') && env.WINDOWS_PFX_B64 != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nezzel-msix-${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
          path: Nezzel_${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}.msix

      - name: Upload PDB symbols (Windows only)
        if: matrix.platform == 'windows-latest' || matrix.platform == 'windows-11-arm'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nezzel-pdb-${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
          path: src-tauri/target/release/public-pdb/*.pdb

      - name: Upload Linux packages for the smoke job (Linux x64 only)
        if: matrix.platform == 'ubuntu-22.04' || matrix.platform == 'ubuntu-24.04'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nezzel-linux-x64-${{ matrix.platform }}
          retention-days: 7
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage

  package-appxupload:
    # Store package: needs the WINDOWS_PFX secrets; turn on with the MSIX_ENABLED repo variable.
    # Runs even when another leg (e.g. an AppImage) failed; the downloads below fail if a
    # Windows MSIX/PDB artifact is missing.
    if: ${{ !cancelled() && vars.MSIX_ENABLED == 'true' }}
    runs-on: windows-latest
    needs: publish-tauri
    permissions:
      contents: read
    steps:
      - name: Download x64 MSIX
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nezzel-msix-x64
          path: dist/msix/x64

      - name: Download arm64 MSIX
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nezzel-msix-arm64
          path: dist/msix/arm64

      - name: Download x64 PDB symbols
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nezzel-pdb-x64
          path: dist/symbols/x64

      - name: Download arm64 PDB symbols
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nezzel-pdb-arm64
          path: dist/symbols/arm64

      - name: Create msixupload
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
  
          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "MakeAppx.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1 | ForEach-Object FullName
          if (-not $makeappx) { throw "MakeAppx.exe not found (Windows SDK missing?)" }
  
          $x64 = Get-ChildItem "dist/msix/x64"   -Filter "*.msix" | Select-Object -First 1
          $arm64 = Get-ChildItem "dist/msix/arm64" -Filter "*.msix" | Select-Object -First 1
          if (-not $x64)   { throw "Missing x64 .msix under dist/msix/x64" }
          if (-not $arm64) { throw "Missing arm64 .msix under dist/msix/arm64" }
  
          if (Test-Path "unpack_tmp") { Remove-Item "unpack_tmp" -Recurse -Force }
          New-Item -ItemType Directory -Force -Path "unpack_tmp" | Out-Null
          & $makeappx unpack /p $x64.FullName /d "unpack_tmp" | Out-Null
          [xml]$xml = Get-Content "unpack_tmp\AppxManifest.xml"
          $version = $xml.Package.Identity.Version
          if (-not $version) { throw "Failed to read Identity.Version from x64 manifest" }
  
          $pdbs = Get-ChildItem -Path "dist/symbols" -Filter "*.pdb" -Recurse
          if (-not $pdbs) { throw "No PDB files found under dist/symbols" }
          Compress-Archive -Path $pdbs.FullName -DestinationPath "Nezzel.appxsym" -Force
  
          if (Test-Path "bundle_in") { Remove-Item "bundle_in" -Recurse -Force }
          New-Item -ItemType Directory -Force -Path "bundle_in" | Out-Null
          Copy-Item $x64.FullName "bundle_in\Nezzel_x64.msix" -Force
          Copy-Item $arm64.FullName "bundle_in\Nezzel_arm64.msix" -Force
  
          & $makeappx bundle /d "bundle_in" /p "Nezzel.msixbundle" /bv $version | Out-Null
  
          if (Test-Path "upload") { Remove-Item "upload" -Recurse -Force }
          New-Item -ItemType Directory -Force -Path "upload" | Out-Null
          Copy-Item "Nezzel.msixbundle" "upload\" -Force
          Copy-Item "Nezzel.appxsym" "upload\" -Force
  
          Compress-Archive -Path "upload\*" -DestinationPath "Nezzel.msixupload" -Force

      - name: Upload msixupload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nezzel-msixupload
          path: Nezzel.msixupload

  updater-json:
    # The one writer of latest.json: pairs every updater bundle with its .sig on the release
    # and fails unless macOS, Windows and Linux (x86_64 + aarch64) are all present.
    needs: publish-tauri
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts/updater-json.py
            src-tauri/tauri.conf.json
          sparse-checkout-cone-mode: false

      - name: Write latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: 'See the assets to download this version and install. If you have an existing install, it will auto-update on launch.'
        run: |
          version=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          python3 scripts/updater-json.py --repo "$GITHUB_REPOSITORY" --tag "app-v$version" --notes "$NOTES"

  third-party-sources:
    # Hash the actual draft-release assets after every bundle leg and latest.json upload.
    needs: [publish-tauri, updater-json]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bundle third-party source and checksum all release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          tag="app-v$version"
          sh scripts/source-bundle.sh "$version" "$RUNNER_TEMP/sources" --repo "$GITHUB_REPOSITORY"
          gh release upload "$tag" "$RUNNER_TEMP/sources/Nezzel-$version-SOURCES.tar.gz" --repo "$GITHUB_REPOSITORY" --clobber
          # The release is still a draft: find it by tag_name in the list (as updater-json.py does) and fetch
          # each asset by id, instead of relying on gh's by-tag lookup for drafts.
          release_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$tag\") | .id")
          [ "$(printf '%s\n' "$release_id" | grep -c .)" = 1 ] || { echo "FAIL expected one release tagged $tag, got: $release_id"; exit 1; }
          mkdir -p "$RUNNER_TEMP/release-assets"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" --jq '.[] | "\(.id) \(.name)"' |
            while read -r asset_id asset_name; do
              gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "$RUNNER_TEMP/release-assets/$asset_name"
            done
          sh scripts/source-bundle.sh --checksums-only "$RUNNER_TEMP/release-assets"
          gh release upload "$tag" "$RUNNER_TEMP/release-assets/SHA256SUMS" --repo "$GITHUB_REPOSITORY" --clobber

  linux-smoke:
    # Installs and runs the x64 Linux packages in clean distro containers
    # (scripts/linux-package-smoke.sh). Runs after every upload, so it never holds back
    # other platforms' assets; any FAIL line fails the run.
    needs: publish-tauri
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: 'ubuntu:22.04'
            package: '*.deb'
          - image: 'ubuntu:24.04'
            package: '*.deb'
          - image: 'debian:12'
            package: '*.deb'
          - image: 'fedora:latest'
            package: '*.rpm'
          - image: 'ubuntu:22.04'
            package: '*.AppImage'
          - image: 'ubuntu:24.04'
            package: '*.AppImage'
          - image: 'debian:12'
            package: '*.AppImage'
          - image: 'archlinux:base'
            package: '*.AppImage'
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/linux-package-smoke.sh
          sparse-checkout-cone-mode: false

      - name: Download Linux packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nezzel-linux-x64-*
          merge-multiple: true
          path: packages

      - name: Install and run the package
        shell: bash
        env:
          PACKAGE_GLOB: ${{ matrix.package }}
        run: |
          shopt -s nullglob globstar
          # shellcheck disable=SC2206 # the glob is the point
          found=(packages/**/$PACKAGE_GLOB)
          if (( ${#found[@]} != 1 )); then
            echo "FAIL expected one $PACKAGE_GLOB package, found ${#found[@]}"
            exit 1
          fi
          bash scripts/linux-package-smoke.sh "${found[0]}"
