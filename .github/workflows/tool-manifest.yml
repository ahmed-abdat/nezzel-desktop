name: Signed tool manifest

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tool-manifest
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'ahmed-abdat/nezzel-desktop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Test offline manifest contracts
        run: python3 -B -m unittest discover -s scripts -p test_fetch_tools.py
      - name: Check public key configuration
        env:
          NEZZEL_MANIFEST_PUBKEY: ${{ vars.NEZZEL_MANIFEST_PUBKEY }}
        run: test -n "$NEZZEL_MANIFEST_PUBKEY"
      - name: Refresh hashes and sign
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEZZEL_MANIFEST_SIGNING_KEY: ${{ secrets.NEZZEL_MANIFEST_SIGNING_KEY }}
          NEZZEL_MANIFEST_PUBKEY: ${{ vars.NEZZEL_MANIFEST_PUBKEY }}
        run: node scripts/manifest-bump.mjs
      - name: Publish fixed release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ahmed-abdat/nezzel-desktop
        run: |
          if ! gh release view tool-manifest >/dev/null 2>&1; then
            gh release create tool-manifest --title 'Signed tool manifest' --notes 'Daily tool pins signed by Nezzel.' --latest=false
          fi
          gh release upload tool-manifest docs/manifest/manifest.json docs/manifest/manifest.sig docs/manifest/gallery-dl-manifest.json docs/manifest/aria2-manifest.json --clobber
