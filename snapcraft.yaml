name: nezzel
title: Nezzel
base: core24
version: '3.2.1'
license: 'AGPL-3.0-or-later'
website: 'https://github.com/ahmed-abdat/nezzel-desktop'
issues: 'https://github.com/ahmed-abdat/nezzel-desktop/issues'
source-code: 'https://github.com/ahmed-abdat/nezzel-desktop'
contact: 'https://github.com/ahmed-abdat/nezzel-desktop/issues'
summary: Save videos, audio and photos from a link
description: |
  Nezzel is a cross-platform, open-source app that makes it easy to download videos, audio, subtitles, and metadata from YouTube and hundreds of other supported websites. It provides a clean desktop interface on top of the powerful yt-dlp engine, so you get advanced download features without needing the command line.

  You can choose the quality and format, download individual items or entire playlists, and manage downloads with pause and resume support. Nezzel is free, privacy-friendly, and fully open source, with no ads, no tracking, and no unnecessary complexity.

grade: stable
confinement: strict

icon: src-tauri/icons/icon.png

platforms:
  amd64:
    build-on: amd64
    build-for: amd64
  arm64:
    build-on: arm64
    build-for: arm64

layout:
  /usr/lib/webkit2gtk-4.1:
    bind: $SNAP/usr/lib/webkit2gtk-4.1

apps:
  nezzel:
    command: usr/bin/nezzel
    desktop: usr/share/applications/Nezzel.desktop
    extensions: [gnome]
    plugs:
      - network
      - network-status
      - home
      - unity7
      - single-instance-plug
    slots:
      - single-instance

slots:
  single-instance:
    interface: dbus
    bus: session
    name: dev.ahmed.nezzel.SingleInstance

plugs:
  single-instance-plug:
    interface: dbus
    bus: session
    name: dev.ahmed.nezzel.SingleInstance

parts:
  build-app:
    plugin: dump
    source: .
    build-snaps:
      - node/24/stable
      - rustup/latest/stable
    build-packages:
      - libwebkit2gtk-4.1-dev
      - build-essential
      - curl
      - wget
      - file
      - libssl-dev
      - libgtk-3-dev
      - libayatana-appindicator3-dev
      - librsvg2-dev
      - dpkg
    stage-packages:
      - libwebkit2gtk-4.1-0
      - libayatana-appindicator3-1
    override-build: |
      set -eu

      corepack enable
      pnpm install --frozen-lockfile
      
      rustup toolchain install stable
      rustup default stable
      cargo install --locked cargo-about

      pnpm tauri build --bundles deb --no-sign -c '{"plugins":{"updater":{"active":false}}}'
      dpkg -x src-tauri/target/release/bundle/deb/*.deb "$SNAPCRAFT_PART_INSTALL/"
      mkdir -p "$CRAFT_PART_INSTALL/usr/lib/webkit2gtk-4.1"

      for TRIPLET in x86_64-linux-gnu aarch64-linux-gnu; do
        SRC="$CRAFT_PART_INSTALL/usr/lib/$TRIPLET/webkit2gtk-4.1"
        if [ -d "$SRC" ]; then
          cp -a "$SRC/." "$CRAFT_PART_INSTALL/usr/lib/webkit2gtk-4.1/"
          break
        fi
      done

      DESKTOP_FILE="$SNAPCRAFT_PART_INSTALL/usr/share/applications/Nezzel.desktop"
      if [ -f "$DESKTOP_FILE" ]; then
        sed -i -E 's/^Categories=.*/Categories=Network;AudioVideo;Utility;/' "$DESKTOP_FILE"
      fi
